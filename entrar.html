<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stokit · entrando</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<!-- ══════════════════════════════════════════════════════════════════════════
     Esto era el «¿de qué empresa eres?» que llevaba a cada subdominio.

     Hoy solo hay una empresa, así que preguntarlo era un paso que no decidía
     nada. La página se queda —redirigiendo— y no se borra a propósito: hay
     marcadores y enlaces viejos apuntando aquí, y un 404 en la puerta de
     entrada es la peor manera de recibir a alguien que quiere trabajar.

     Tres capas para que funcione siempre: la cabecera del navegador, el guion
     y, si no hay ninguna de las dos, un enlace a mano.
     ══════════════════════════════════════════════════════════════════════ -->
<meta http-equiv="refresh" content="0; url=https://palmapictures.stokit.es/">
<link rel="canonical" href="https://palmapictures.stokit.es/">
<style>
  :root { color-scheme: light dark; --papel: #eef0f4; --tinta: #14161f; --tinta-2: #4e5566; --sello: #c8102e; }
  @media (prefers-color-scheme: dark) { :root { --papel: #0b0b0d; --tinta: #eaecf2; --tinta-2: #9aa2b4; --sello: #ff4d5f; } }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; gap: 0;
    background: var(--papel); color: var(--tinta);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .caja { text-align: center; padding: 26px; }
  .marca { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.02em; font-size: 19px; }
  .punto { width: 9px; height: 9px; background: var(--sello); }
  p { margin: 18px 0 0; color: var(--tinta-2); font-size: 15px; }
  a { color: var(--tinta); }
</style>
</head>
<body>
  <div class="caja">
    <span class="marca"><i class="punto"></i> Stokit</span>
    <p>Llevándote a <strong>Palma Pictures</strong>…</p>
    <p><a href="https://palmapictures.stokit.es/">Entrar ahora</a></p>
  </div>
  <script>location.replace('https://palmapictures.stokit.es/');</script>
</body>
</html>
